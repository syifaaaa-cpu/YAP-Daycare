<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" fill="none">
  <!-- Brand Palette: Dark Forest Green #00473A, Bright Teal #00A896, Warm Gold #F39C12, Soft Coral #E76F51 -->
  
  <!-- Abstract Toy Building Blocks forming Mosque Dome & Arch -->
  <g id="toy-blocks-dome">
    <!-- Base block: Rounded rectangular base in Dark Green -->
    <rect x="20" y="116" width="160" height="34" rx="8" fill="#00473A" />
    
    <!-- Central Arch cutout inside base block (Islamic Doorway) -->
    <path d="M80 150 L80 128 C80 120 90 114 100 114 C110 114 120 120 120 128 L120 150 Z" fill="#FAF7F0" />
    
    <!-- Left Toy Block: Warm Gold Cube with rounded corners -->
    <rect x="24" y="66" width="46" height="46" rx="9" fill="#F39C12" />
    <circle cx="47" cy="89" r="8" fill="#FAF7F0" opacity="0.6" />
    
    <!-- Right Toy Block: Soft Coral Cube -->
    <rect x="130" y="66" width="46" height="46" rx="9" fill="#E76F51" />
    <polygon points="153,78 163,98 143,98" fill="#FAF7F0" opacity="0.6" />
    
    <!-- Center Pillar Block: Bright Teal Cylinder/Arch -->
    <rect x="74" y="52" width="52" height="60" rx="8" fill="#00A896" />
    
    <!-- Top Mosque Dome Block: Elegant curved pointed dome in Deep Green & Gold Star -->
    <path d="M72 48 C72 48 84 16 100 8 C116 16 128 48 128 48 Z" fill="#006C59" />
    
    <!-- Golden Crescent Moon & Star finial on top of dome -->
    <path d="M100 2 C104 2 107 5 106 8 C103 8 100 7 98 4 C99 3 99.5 2 100 2 Z" fill="#F39C12" />
    <polygon points="100,-3 102,1 106,1 103,4 104,8 100,5 96,8 97,4 94,1 98,1" fill="#F39C12" transform="scale(0.8) translate(25, -2)" />
    
    <!-- Subtle tactile 3D studs on blocks (toy block dots) -->
    <rect x="36" y="60" width="22" height="6" rx="3" fill="#D68910" />
    <rect x="142" y="60" width="22" height="6" rx="3" fill="#D35400" />
  </g>

  <!-- Elegant Vertical Separator in Forest Green / Teal Accent -->
  <rect x="206" y="14" width="5" height="148" rx="2.5" fill="#00A896" />

  <!-- Typography: RAUDHAH ASIH PUTERA -->
  <g id="brand-typography">
    <!-- Top Subtitle: ISLAMIC EARLY CHILDHOOD CENTER -->
    <text x="236" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="4" fill="#F39C12">
      ISLAMIC EARLY CHILDHOOD CENTER
    </text>

    <!-- Main Title: RAUDHAH ASIH PUTERA -->
    <text x="234" y="118" font-family="'Plus Jakarta Sans', 'Montserrat', system-ui, sans-serif" font-size="64" font-weight="900" letter-spacing="0.5" fill="#00473A">
      RAUDHAH ASIH PUTERA
    </text>

    <!-- Tagline: DAYCARE & KINDERGARTEN -->
    <text x="236" y="152" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="4.5" fill="#00A896">
      DAYCARE &amp; KINDERGARTEN
    </text>
  </g>
</svg>
