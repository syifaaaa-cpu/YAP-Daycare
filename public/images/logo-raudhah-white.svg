<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" fill="none">
  <!-- Brand Palette on Dark Background -->
  
  <!-- Abstract Toy Building Blocks forming Mosque Dome & Arch -->
  <g id="toy-blocks-dome-white">
    <!-- Base block in White / Mint -->
    <rect x="20" y="116" width="160" height="34" rx="8" fill="#FFFFFF" />
    
    <!-- Central Arch cutout inside base block -->
    <path d="M80 150 L80 128 C80 120 90 114 100 114 C110 114 120 120 120 128 L120 150 Z" fill="#00473A" />
    
    <!-- Left Toy Block: Warm Gold Cube -->
    <rect x="24" y="66" width="46" height="46" rx="9" fill="#F39C12" />
    <circle cx="47" cy="89" r="8" fill="#FFFFFF" opacity="0.8" />
    
    <!-- Right Toy Block: Soft Coral / Salmon -->
    <rect x="130" y="66" width="46" height="46" rx="9" fill="#FF8C70" />
    <polygon points="153,78 163,98 143,98" fill="#FFFFFF" opacity="0.8" />
    
    <!-- Center Pillar Block: Bright Teal -->
    <rect x="74" y="52" width="52" height="60" rx="8" fill="#00D2BD" />
    
    <!-- Top Mosque Dome Block -->
    <path d="M72 48 C72 48 84 16 100 8 C116 16 128 48 128 48 Z" fill="#E0F7F6" />
    
    <!-- Golden Crescent Moon on top -->
    <circle cx="100" cy="5" r="5" fill="#F39C12" />
  </g>

  <!-- Vertical Separator in Bright Teal -->
  <rect x="206" y="14" width="5" height="148" rx="2.5" fill="#00D2BD" />

  <!-- Typography on Dark Footer -->
  <g id="brand-typography-white">
    <!-- Top Subtitle -->
    <text x="236" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="4" fill="#F39C12">
      ISLAMIC EARLY CHILDHOOD CENTER
    </text>

    <!-- Main Title -->
    <text x="234" y="118" font-family="'Plus Jakarta Sans', 'Montserrat', system-ui, sans-serif" font-size="64" font-weight="900" letter-spacing="0.5" fill="#FFFFFF">
      RAUDHAH ASIH PUTERA
    </text>

    <!-- Tagline -->
    <text x="236" y="152" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="4.5" fill="#00D2BD">
      DAYCARE &amp; KINDERGARTEN
    </text>
  </g>
</svg>
